[package]
name = "cya-ls"
version = "0.1.0"
edition = "2024"
description = "Cyallo and CAIE pseudocode language server"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-highlight = "0.27.2"
tree-sitter = "0.27.2"
tree-sitter-cyallo = { path = "../tree-sitter-cyallo" }
tree-sitter-caie = { path = "../tree-sitter-caie" }

[dev-dependencies]
cyallo-parser = { path = "../cyallo-parser" }
caie-int-parser = { path = "../caie-int-parser" }
